name: One-off lightweight preview build

# This workflow exists on the disposable build branch only.
# Routine development pushes do not trigger it or the large CI matrix.
on:
  push:
    branches: [build/accoding-thin-preview]

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - name: TypeScript check
        run: npm run typecheck
      - name: Focused standalone regression tests
        run: npm run test:standalone
      - name: Exercise independent exam-kit preset
        uses: actions/checkout@v4
        with:
          repository: Annouimo/c-exam-kit
          ref: feat/lightweight-io-standalone-preset
          path: exam-kit
      - name: Compile actual exam-kit C99 input/output macros
        shell: bash
        run: |
          set -euo pipefail
          PRESET="$GITHUB_WORKSPACE/exam-kit/scaffold/presets/exam-io-c99"
          bun src/standalone/cli.ts scaffold init /tmp/accoding-exam-kit-smoke --preset "$PRESET"
          cat > /tmp/accoding-exam-kit-smoke/main.c <<'EOF'
          #include "exam.h"
          int main(void) {
              int n = read_int();
              int a[4];
              read_ints(a, n);
              print_ints(a, n, " ", "\n");
              return 0;
          }
          EOF
          bun src/standalone/cli.ts scaffold prepare /tmp/accoding-exam-kit-smoke/main.c
          cc -std=c99 /tmp/accoding-exam-kit-smoke/.accoding/submit.c -lm -o /tmp/accoding-exam-kit-smoke/program
          test "$(printf '3 10 20 30\n' | /tmp/accoding-exam-kit-smoke/program)" = "10 20 30"
      - name: Produce lightweight, single-file Bun bundle
        run: npm run build:standalone:light
      - name: Verify standalone operation without node_modules
        run: npm run check:standalone:light
      - name: Hash and upload preview
        shell: bash
        run: |
          set -euo pipefail
          (cd dist && sha256sum accoding.mjs > accoding.mjs.sha256)
          ls -lh dist/accoding.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: accoding-bun-single-file-preview
          path: |
            dist/accoding.mjs
            dist/accoding.mjs.sha256
          if-no-files-found: error
          retention-days: 14
